name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test, migration script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json # same SDK as on my machine
          cache: true                   # NuGet cache keyed on the lock files
          cache-dependency-path: '**/packages.lock.json'

      # --locked-mode: fail if a package version drifts from packages.lock.json.
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore

      # Testcontainers starts real Postgres + Redis. GitHub's Ubuntu runners have Docker already.
      - run: dotnet test -c Release --no-build

      # The SQL that chapter 14 runs against production. Idempotent: safe to run twice.
      # dotnet ef runs Program.cs, which needs a connection string. It never connects, so a placeholder is fine.
      # Careful: in dotnet ef, -c means --context, not --configuration.
      - name: Generate idempotent migration script
        env:
          ConnectionStrings__Database: Host=unused
          ConnectionStrings__Redis: unused:6379
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent --no-build --configuration Release \
            --project src/Ticketing.Api -o artifacts/migrations.sql -- --environment Production

      - uses: actions/upload-artifact@v7
        with:
          name: migrations-sql
          path: artifacts/migrations.sql

  image:
    name: Build and push image
    needs: build-test
    # Only after a merge to main. PRs build and test, they don't publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN, no secrets to manage
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" and "sha-<short commit>". Deploy the sha tag, so you always know what is running.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
